# Ambiente local de demonstração: segurança do Elasticsearch desligada, portas só em 127.0.0.1.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["127.0.0.1:9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Importa data views, visualizações e o dashboard no Kibana e encerra.
  kibana-setup:
    image: curlimages/curl:8.11.1
    depends_on:
      kibana: {condition: service_healthy}
    volumes: ["./kibana:/kibana:ro"]
    command: >
      sh -c "curl -fsS -X POST 'http://kibana:5601/api/saved_objects/_import?overwrite=true'
      -H 'kbn-xsrf: true' --form file=@/kibana/dashboard.ndjson"
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  rpa:
    build: .
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta   # o modo otel do ES descarta histogramas cumulativos
      RPA_INTERVAL_SECONDS: "60"   # 0 = executa uma vez e encerra
    depends_on:
      elasticsearch: {condition: service_healthy}
      otel-collector: {condition: service_started}
    restart: on-failure

volumes:
  esdata:
