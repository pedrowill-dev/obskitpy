receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  batch: {}

exporters:
  # Modo "otel": data streams logs-/traces-/metrics-generic.otel-default (templates nativos do ES 8.16+).
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    logs_index: logs-generic.otel-default
    traces_index: traces-generic.otel-default
    metrics_index: metrics-generic.otel-default
    mapping:
      mode: otel

service:
  pipelines:
    logs:    {receivers: [otlp], processors: [batch], exporters: [elasticsearch]}
    traces:  {receivers: [otlp], processors: [batch], exporters: [elasticsearch]}
    metrics: {receivers: [otlp], processors: [batch], exporters: [elasticsearch]}
