name: CI
on:
  push:
  pull_request:

jobs:
  obskit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "./obskit[requests,test]"
      - run: pytest obskit/tests

  exemplo-noticias-sp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
        working-directory: exemplo-noticias-sp
      - run: pytest tests
        working-directory: exemplo-noticias-sp
