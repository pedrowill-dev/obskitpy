[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obskitpy"
version = "0.9.0"
description = "Observabilidade (OpenTelemetry + Elasticsearch + Kibana) para qualquer projeto Python, via CLI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pedro França" }]
keywords = ["observability", "opentelemetry", "elasticsearch", "kibana", "rpa", "logging", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.27.0",
]

[project.urls]
Homepage = "https://github.com/pedrowill-dev/obskitpy"
Documentation = "https://github.com/pedrowill-dev/obskitpy/tree/main/docs"
Issues = "https://github.com/pedrowill-dev/obskitpy/issues"

[project.optional-dependencies]
requests = ["opentelemetry-instrumentation-requests==0.48b0", "setuptools==75.6.0"]
portal = [
    "fastapi>=0.115,<0.150",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "httpx>=0.27",
    "pydantic>=2.8",
]
test = ["pytest"]

[project.scripts]
obskitpy = "obskitpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obskitpy = ["templates/*", "templates/dash/*"]
