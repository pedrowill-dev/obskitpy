# Gerado pelo obskitpy. Serve o dash-obskitpy e expõe ao navegador só a leitura do Elasticsearch
# (_search, _count e _field_caps) em /es/. Escrita e administração ficam bloqueadas.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = / { try_files /index.html =404; }

  location ~ ^/es/([^/]+)/(_search|_count|_field_caps)$ {
    limit_except GET POST { deny all; }
    rewrite ^/es/(.*)$ /$1 break;
    proxy_pass http://elasticsearch:9200;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }
  location /es/ { return 403; }

  add_header Cache-Control "no-cache";
}
