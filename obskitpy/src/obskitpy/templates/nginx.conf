# Gerado pelo obskitpy. Serve o dash-obskitpy e expõe ao navegador só a leitura do Elasticsearch
# (_search, _count e _field_caps) em /es/. Escrita e administração ficam bloqueadas.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # o navegador sempre revalida os arquivos do dash: depois de `obskitpy dash update` a versão nova aparece sem limpar o cache
  add_header Cache-Control "no-cache" always;

  location = / { try_files /index.html =404; }

  # Os serviços são resolvidos na hora da requisição: o dash sobe mesmo se o Elasticsearch ou o portal ainda não estão de pé.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location ~ ^/es/([^/]+)/(_search|_count|_field_caps)$ {
    limit_except GET POST { deny all; }
    set $elasticsearch http://elasticsearch:9200;
    rewrite ^/es/(.*)$ /$1 break;
    proxy_pass $elasticsearch;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }
  location /es/ { return 403; }

  # Portal de alertas (só existe se `obskitpy portal enable` foi usado). O host é resolvido na hora da requisição.
  location /api/ {
    set $portal http://portal:8000;
    proxy_pass $portal;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
  }

  add_header Cache-Control "no-cache";
}
