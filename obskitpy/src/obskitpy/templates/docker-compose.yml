# Gerado pelo obskitpy. Ambiente local: segurança do Elasticsearch desligada, portas só em 127.0.0.1.
# Portas, serviço e interface (COMPOSE_PROFILES: kibana e/ou dash) vêm do .env desta pasta.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["127.0.0.1:${ES_PORT:-9200}:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    profiles: [kibana]
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["127.0.0.1:${KIBANA_PORT:-5601}:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # dash-obskitpy: dashboard leve (HTML/JS) servido pelo nginx, com proxy somente leitura para o Elasticsearch.
  dash:
    profiles: [dash]
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${DASH_PORT:-8600}:80"]
    volumes:
      - ./dash:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Portal de alertas e integrações (perfil `portal`): API FastAPI + PostgreSQL. Ative com `obskitpy portal enable`.
  postgres:
    profiles: [portal]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obskitpy
      POSTGRES_USER: obskitpy
    env_file:
      - {path: .portal.env, required: false}   # POSTGRES_PASSWORD
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obskitpy -d obskitpy"]
      interval: 5s
      timeout: 3s
      retries: 20

  portal:
    profiles: [portal]
    image: python:3.12-slim
    env_file:
      - {path: .portal.env, required: false}   # DATABASE_URL, OBSKITPY_SECRET_KEY, administrador inicial, OBSKITPY_PIP_SPEC
    command: ["sh", "-c", "pip install --no-cache-dir --quiet \"$${OBSKITPY_PIP_SPEC}\" && exec uvicorn obskitpy.portal.app:create_app --factory --host 0.0.0.0 --port 8000"]
    environment:
      OBSKITPY_ES_URL: http://elasticsearch:9200   # o avaliador de alertas consulta os dados daqui
    ports: ["127.0.0.1:${PORTAL_PORT:-8700}:8000"]
    volumes: [portal_pip:/root/.cache/pip]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317", "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"]
    depends_on:
      elasticsearch: {condition: service_healthy}

volumes:
  esdata:
  pgdata:
  portal_pip:
