<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dash-obskitpy</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="./" aria-label="dash-obskitpy"><img src="logo.png" alt="obskitpy" height="30"><span class="chip">dash</span></a>
    <select class="svc" id="svc" title="Projeto (automação) que você está vendo" aria-label="Projeto"></select><span class="live" id="live" hidden><i></i>AO VIVO</span>
    <nav class="tabs" id="tabs" aria-label="Seções">
      <a href="#overview" data-tab="overview">Visão geral</a>
      <a href="#logs" data-tab="logs">Logs</a>
      <a href="#traces" data-tab="traces">Traces</a>
      <a href="#metrics" data-tab="metrics">Métricas</a>
      <a href="#integrations" data-tab="integrations">Integrações</a>
    </nav>
    <div class="tools">
      <button class="rt" id="rt" type="button" aria-pressed="false" title="Tempo real: últimos 5 min, atualizando a cada 1 s (tecla R)"><i></i><span>Realtime</span></button>
      <div class="pop-wrap"><button class="ctl" id="range-btn" type="button" aria-haspopup="true" title="Período mostrado (segundos, minutos, horas ou dias)"><span class="k">Período</span><b id="range-label"></b><em>▾</em></button><div class="pop" id="range-pop" hidden></div></div>
      <div class="pop-wrap"><button class="ctl" id="refresh-btn" type="button" aria-haspopup="true" title="Frequência de atualização (segundos, minutos ou horas)"><span class="k">Atualizar</span><b id="refresh-label"></b><em>▾</em></button><div class="pop" id="refresh-pop" hidden></div></div>
      <button class="icon" id="refresh" title="Atualizar agora" aria-label="Atualizar">⟳</button>
      <a class="btn-link" id="kibana" hidden target="_blank" rel="noopener">Kibana ↗</a>
    </div>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer class="wrap foot"><span id="status"><i class="dot"></i> conectando…</span><span>dash-obskitpy · OpenTelemetry + Elasticsearch</span></footer>
<script src="config.js"></script>
<script src="app.js"></script>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
