site_name: obskitpy
site_description: Observabilidade (OpenTelemetry + Elasticsearch + Kibana) para automações Python, via CLI.
site_url: https://pedrowill-dev.github.io/obskitpy/
repo_url: https://github.com/pedrowill-dev/obskitpy
repo_name: pedrowill-dev/obskitpy
edit_uri: edit/main/docs/
copyright: MIT © 2026 Pedro França

theme:
  name: material
  language: pt-BR
  logo: images/logo-icon.png
  favicon: images/logo-icon.png
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle: {icon: material/weather-night, name: Modo escuro}
    - scheme: slate
      primary: teal
      accent: amber
      toggle: {icon: material/weather-sunny, name: Modo claro}
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

nav:
  - Início: index.md
  - Início rápido: inicio-rapido.md
  - Guia:
      - CLI e biblioteca: guia-obskitpy.md
      - Dashboards: dashboards.md
      - Exemplo (notícias da Prefeitura de SP): exemplo.md
  - Entenda:
      - Arquitetura: arquitetura.md
      - Solução de problemas: solucao-de-problemas.md
  - Mantenedores:
      - Publicando no PyPI: publicando.md
      - Contribuindo: https://github.com/pedrowill-dev/obskitpy/blob/main/CONTRIBUTING.md
